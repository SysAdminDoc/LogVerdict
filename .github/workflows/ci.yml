name: LogVerdict CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: PowerShell ${{ matrix.shell }} quality
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned test tools
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -AllowClobber
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber
          Install-Module ps2exe -RequiredVersion 1.0.18 -Scope CurrentUser -Force -AllowClobber

      - name: Parse all PowerShell with this runtime
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(Get-ChildItem -LiteralPath . -File -Filter '*.ps1' -Recurse) + @(Get-Item .\LogVerdict.psm1)
          foreach ($path in $paths) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $path.FullName -Raw))
          }
          if ('${{ matrix.shell }}' -eq 'pwsh' -and $PSVersionTable.PSVersion -lt [version]'7.6.0') {
            throw ("The PowerShell Core CI leg must run PowerShell 7.6 or newer; found {0}." -f $PSVersionTable.PSVersion)
          }
          Test-ModuleManifest -Path .\LogVerdict.psd1 | Out-Null

      - name: Run tests
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = '${{ matrix.shell }}'
          $exe = if ($runtime -eq 'powershell') { 'powershell.exe' } else { 'pwsh.exe' }
          $configuration = @'
          $config = New-PesterConfiguration
          $config.Run.Path = '.\Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          Invoke-Pester -Configuration $config
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'logverdict-pester-run.ps1'
          Set-Content -LiteralPath $scriptPath -Value $configuration -Encoding UTF8
          & $exe -NoProfile -STA -ExecutionPolicy Bypass -File $scriptPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run GUI accessibility and scaling smoke matrix
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\Test-LogVerdictGui.ps1 -Theme Normal -ScalePercent 125
          $guiExit = [int]$LASTEXITCODE
          if ($guiExit -ne 0) { exit $guiExit }
          .\Tools\Test-LogVerdictGui.ps1 -Theme HighContrast -ScalePercent 125
          $guiExit = [int]$LASTEXITCODE
          if ($guiExit -ne 0) { exit $guiExit }

      - name: Prove GUI filter rejects renamed suites
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'logverdict-gui-vacuity-probe.ps1'
          $source = Get-Content -LiteralPath .\Tests\LogVerdict.Tests.ps1 -Raw -Encoding UTF8
          $renamed = [regex]::Replace($source, "(?m)^Describe 'GUI", "Describe 'Renamed")
          if ($renamed -eq $source) { throw 'The GUI vacuity probe did not rename any GUI Describe block.' }
          Set-Content -LiteralPath $probe -Value $renamed -Encoding UTF8
          try {
            $probeExit = 0
            try {
              .\Tools\Test-LogVerdictGui.ps1 -TestPath $probe -Theme Normal -ScalePercent 125
              $probeExit = if ($LASTEXITCODE) { [int]$LASTEXITCODE } else { 0 }
            } catch {
              $probeExit = 1
              Write-Output ('Expected vacuity rejection: {0}' -f $_.Exception.Message)
            }
            if ($probeExit -eq 0) { throw 'The GUI filter accepted a deliberately renamed test suite.' }
            Write-Output ('GUI vacuity probe correctly failed with exit code {0}.' -f $probeExit)
          } finally {
            if (Test-Path -LiteralPath $probe) { Remove-Item -LiteralPath $probe -Force }
          }

      - name: Run structured coverage gate in STA
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = '${{ matrix.shell }}'
          $exe = if ($runtime -eq 'powershell') { 'powershell.exe' } else { 'pwsh.exe' }
          $report = Join-Path $env:GITHUB_WORKSPACE ("coverage-{0}.json" -f $runtime)
          & $exe -NoProfile -STA -ExecutionPolicy Bypass -File .\Tools\Test-LogVerdictCoverage.ps1 -OutputPath $report
          $coverageExit = [int]$LASTEXITCODE
          if ($coverageExit -ne 0) { exit $coverageExit }

      - name: Upload structured coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logverdict-coverage-${{ matrix.shell }}
          path: coverage-${{ matrix.shell }}.json
          if-no-files-found: warn

      - name: Run content-free performance budgets
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = '${{ matrix.shell }}'
          $report = Join-Path $env:GITHUB_WORKSPACE ("performance-{0}.json" -f $runtime)
          .\Tools\Test-LogVerdictPerformance.ps1 -OutputPath $report -BudgetPath .\Data\performance-budgets.json
          $performanceExit = [int]$LASTEXITCODE
          if ($performanceExit -ne 0) { exit $performanceExit }

      - name: Upload content-free performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logverdict-performance-${{ matrix.shell }}
          path: performance-${{ matrix.shell }}.json
          if-no-files-found: warn

      - name: Run analyzer
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 -EnableExit

      - name: Audit constrained-language compatibility
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = @{ Rules = @{ PSUseConstrainedLanguageMode = @{ Enable = $true } } }
          $paths = @('.\Private', '.\Public', '.\Invoke-LogVerdict.ps1', '.\LogVerdict-GUI.ps1')
          $findings = @($paths | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -IncludeRule PSUseConstrainedLanguageMode -Settings $settings -Severity Warning
          })
          Write-Host ('PSUseConstrainedLanguageMode findings: {0}' -f $findings.Count)
          $findings | Group-Object ScriptName | Sort-Object Name | Select-Object Name, Count | Format-Table -AutoSize
          $findings | Select-Object -First 25 ScriptName, Line, Column, Message | Format-Table -Wrap
          Write-Host 'Findings are an explicit compatibility inventory; the supported surface is documented in README.md.'

      - name: Run runtime-agnostic release gates
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\Test-LogVerdictReleaseStatic.ps1
          $staticExit = [int]$LASTEXITCODE
          if ($staticExit -ne 0) { exit $staticExit }

      - name: Run Core schema release gates
        if: matrix.shell == 'pwsh'
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\Test-LogVerdictRelease.ps1
          $releaseExit = [int]$LASTEXITCODE
          if ($releaseExit -ne 0) { exit $releaseExit }

  package:
    name: Build and verify release assets
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 6.0.1 -Scope CurrentUser -Force -AllowClobber
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber
          Install-Module ps2exe -RequiredVersion 1.0.18 -Scope CurrentUser -Force -AllowClobber

      - name: Build unsigned executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\Build-LogVerdictExe.ps1
          $buildExit = [int]$LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }

      - name: Smoke packaged console executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $consolePath = Join-Path (Get-Location).Path 'dist\LogVerdict.exe'
          $version = (& .\Tools\Get-LogVerdictVersion.ps1).Trim()
          $allowedExitCodes = @(0..4)

          & $consolePath -DaysBack 1 -NoReport -NoPause
          $noReportExit = [int]$LASTEXITCODE
          if ($allowedExitCodes -notcontains $noReportExit) {
            throw "Packaged console no-report smoke returned unexpected exit code $noReportExit."
          }

          $scratch = Join-Path $env:RUNNER_TEMP 'logverdict-console-smoke'
          if (Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force }
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          try {
            & $consolePath -DaysBack 1 -OutputDir $scratch -Format All -NoPause
            $reportExit = [int]$LASTEXITCODE
            if ($allowedExitCodes -notcontains $reportExit) {
              throw "Packaged console report smoke returned unexpected exit code $reportExit."
            }

            $requiredReports = @(
              'LogVerdict-Report.txt'
              'LogVerdict-Report.json'
              'LogVerdict-Report.csv'
              'LogVerdict-Report.html'
              'LogVerdict-Ticket-Summary.md'
              'LogVerdict-Run.log'
            )
            foreach ($name in $requiredReports) {
              $path = Join-Path $scratch $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Packaged console did not write required report '$name'."
              }
            }

            $json = Get-Content -LiteralPath (Join-Path $scratch 'LogVerdict-Report.json') -Raw -Encoding UTF8 | ConvertFrom-Json
            if ([string]$json.Version -ne $version) {
              throw "Packaged JSON report version '$($json.Version)' does not match VERSION '$version'."
            }
            Write-Output "Packaged console smoke passed with report exit code $reportExit and version $version."
          } finally {
            if (Test-Path -LiteralPath $scratch) { Remove-Item -LiteralPath $scratch -Recurse -Force }
          }

      - name: Regenerate package metadata from local assets
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $version = (& .\Tools\Get-LogVerdictVersion.ps1).Trim()
          $date = (Get-Date).ToString('yyyy-MM-dd')
          .\Tools\New-PackageManifests.ps1 -Version $version -AssetDirectory (Join-Path $root 'dist') -ReleaseDate $date -OutputDirectory (Join-Path $env:RUNNER_TEMP 'logverdict-packaging')
          $manifestExit = [int]$LASTEXITCODE
          if ($manifestExit -ne 0) { exit $manifestExit }

      - name: Generate SPDX SBOM and build provenance
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $version = (& .\Tools\Get-LogVerdictVersion.ps1).Trim()
          .\Tools\New-LogVerdictSupplyChain.ps1 -Version $version -AssetDirectory (Join-Path $root 'dist') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'logverdict-supply-chain') -SourceDirectory $root -RequireModuleZip
          $supplyChainExit = [int]$LASTEXITCODE
          if ($supplyChainExit -ne 0) { exit $supplyChainExit }

      - name: Verify supply-chain metadata directly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $version = (& .\Tools\Get-LogVerdictVersion.ps1).Trim()
          .\Tools\Test-LogVerdictSupplyChain.ps1 -Version $version -MetadataDirectory (Join-Path $env:RUNNER_TEMP 'logverdict-supply-chain') -AssetDirectory (Join-Path $root 'dist') -SourceDirectory $root -RequireModuleZip
          $supplyChainVerifyExit = [int]$LASTEXITCODE
          if ($supplyChainVerifyExit -ne 0) { exit $supplyChainVerifyExit }

      - name: Validate package hashes and version provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\Tools\Test-LogVerdictRelease.ps1 -ManifestDirectory (Join-Path $env:RUNNER_TEMP 'logverdict-packaging') -AssetDirectory (Join-Path (Get-Location).Path 'dist') -SupplyChainDirectory (Join-Path $env:RUNNER_TEMP 'logverdict-supply-chain') -ReleaseValidation -RequireModuleZip
          $releaseValidationExit = [int]$LASTEXITCODE
          if ($releaseValidationExit -ne 0) { exit $releaseValidationExit }

      - name: Launch packaged GUI smoke matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $normal = Join-Path $env:RUNNER_TEMP 'logverdict-gui-normal.json'
          $highContrast = Join-Path $env:RUNNER_TEMP 'logverdict-gui-high-contrast.json'
          $screenshot = Join-Path $env:RUNNER_TEMP 'logverdict-gui-normal.png'
          $screenshotMetadata = Join-Path $env:RUNNER_TEMP 'logverdict-gui-normal-screenshot.json'
          .\Tools\Test-LogVerdictGuiArtifact.ps1 -GuiPath .\dist\LogVerdict-GUI.exe -EvidencePath $normal -Theme Normal -ScreenshotPath $screenshot -ScreenshotMetadataPath $screenshotMetadata
          $normalGuiExit = [int]$LASTEXITCODE
          if ($normalGuiExit -ne 0) { exit $normalGuiExit }
          .\Tools\Test-LogVerdictGuiArtifact.ps1 -GuiPath .\dist\LogVerdict-GUI.exe -EvidencePath $highContrast -Theme HighContrast
          $highContrastGuiExit = [int]$LASTEXITCODE
          if ($highContrastGuiExit -ne 0) { exit $highContrastGuiExit }

      - name: Verify packaged GUI placement in coverage gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'logverdict-gui-coverage.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'logverdict-gui-normal.json'
          & pwsh -NoProfile -STA -ExecutionPolicy Bypass -File .\Tools\Test-LogVerdictCoverage.ps1 -OutputPath $report -DisplayEvidencePath $evidence
          $guiCoverageExit = [int]$LASTEXITCODE
          if ($guiCoverageExit -ne 0) { exit $guiCoverageExit }

      - name: Upload packaged GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logverdict-gui-smoke
          path: |
            ${{ runner.temp }}/logverdict-gui-normal.json
            ${{ runner.temp }}/logverdict-gui-high-contrast.json
            ${{ runner.temp }}/logverdict-gui-normal.png
            ${{ runner.temp }}/logverdict-gui-normal-screenshot.json
            ${{ runner.temp }}/logverdict-gui-coverage.json
            ${{ runner.temp }}/logverdict-supply-chain/**
          if-no-files-found: warn
